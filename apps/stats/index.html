<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Analytics - Study performance dashboard">
    <title>Analytics</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app" class="app-wrapper">
        <aside class="sidebar glass-panel">
            <div class="sidebar-header">
                <div class="logo">
                    <span class="logo-icon">📊</span>
                    <h1>Analytics</h1>
                </div>
            </div>

            <nav class="sidebar-nav">
                <button class="nav-item active" data-range="today"><span>☀️</span><span>Today</span></button>
                <button class="nav-item" data-range="week"><span>📅</span><span>This Week</span></button>
                <button class="nav-item" data-range="month"><span>🗓️</span><span>This Month</span></button>
                <button class="nav-item" data-range="all"><span>📈</span><span>All Time</span></button>
            </nav>

            <div class="sidebar-section">
                <h3>Modules</h3>
                <div class="category-list">
                    <button class="category-btn active" data-module="all">All</button>
                    <button class="category-btn" data-module="calendar">📅 Calendar</button>
                    <button class="category-btn" data-module="tasks">✅ Tasks</button>
                    <button class="category-btn" data-module="writer">✍️ Writer</button>
                </div>
            </div>

            <div class="sidebar-stats glass-panel-inner">
                <h3>Summary</h3>
                <div class="stat-row"><span>Total Events:</span><span id="stat-events">0</span></div>
                <div class="stat-row"><span>Total Tasks:</span><span id="stat-tasks">0</span></div>
                <div class="stat-row"><span>Completed:</span><span id="stat-completed">0</span></div>
                <div class="stat-row"><span>Notes:</span><span id="stat-notes">0</span></div>
            </div>

            <div class="sidebar-footer">
                <button id="theme-toggle" class="icon-btn" title="Theme"><span>🌙</span></button>
                <button id="refresh-btn" class="icon-btn" title="Refresh"><span>🔄</span></button>
            </div>
        </aside>
        <main class="main-content">
            <button class="sidebar-toggle" type="button" aria-label="Toggle sidebar" aria-expanded="true">☰</button>
            <section class="kpi-grid">
                <div class="kpi-card glass-panel">
                    <div class="kpi-icon">📅</div>
                    <div class="kpi-value" id="kpi-events">0</div>
                    <div class="kpi-label">Events</div>
                </div>
                <div class="kpi-card glass-panel">
                    <div class="kpi-icon">✅</div>
                    <div class="kpi-value" id="kpi-completed">0</div>
                    <div class="kpi-label">Tasks Done</div>
                </div>
                <div class="kpi-card glass-panel">
                    <div class="kpi-icon">⏱️</div>
                    <div class="kpi-value" id="kpi-focus">0m</div>
                    <div class="kpi-label">Focus Time</div>
                </div>
                <div class="kpi-card glass-panel">
                    <div class="kpi-icon">🖊️</div>
                    <div class="kpi-value" id="kpi-words">0</div>
                    <div class="kpi-label">Words Written</div>
                </div>
            </section>
            <section class="charts-grid">
                <div class="chart-card glass-panel">
                    <h3 class="chart-title">Productivity Overview</h3>
                    <div class="bar-chart" id="bar-chart"></div>
                </div>
                <div class="chart-card glass-panel">
                    <h3 class="chart-title">Category Distribution</h3>
                    <div class="donut-wrap">
                        <div class="donut-chart" id="donut-chart"></div>
                        <div id="donut-legend" class="donut-legend"></div>
                    </div>
                </div>
            </section>
            <section class="activity-card glass-panel">
                <h3 class="chart-title">Recent Activity</h3>
                <div id="activity-list" class="activity-list"></div>
            </section>
        </main>
    </div>
    <div id="theme-menu" class="theme-menu hidden">
        <button data-theme="normal">☀️ Normal</button>
        <button data-theme="dark">🌙 Dark</button>
        <button data-theme="light">✨ Light</button>
        <button data-theme="glass">💎 Glass</button>
    </div>
    <div id="toast-container" class="toast-container"></div>

    <script src="main.js"></script>
</body>
</html>
