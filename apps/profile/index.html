<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Profile - Personal identity & workspace customization">
    <title>Profile | Identity</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app" class="app-wrapper">

        <!-- Banner -->
        <div class="profile-banner" id="profile-banner">
            <div class="banner-overlay"></div>
            <div class="banner-content">
                <div class="avatar-container">
                    <div class="avatar" id="avatar-display">🧑‍🎓</div>
                    <button class="avatar-edit" onclick="document.getElementById('avatar-input').click()">📷</button>
                    <input type="file" id="avatar-input" accept="image/*" style="display:none">
                </div>
                <div class="banner-info">
                    <h1 id="display-name">Scholar</h1>
                    <p id="display-role">Student · Researcher</p>
                </div>
            </div>
        </div>

        <!-- Main Grid -->
        <main class="profile-main">

            <!-- Identity Form -->
            <section class="profile-card glass-panel">
                <h2 class="card-title">Identity</h2>
                <div class="form-group">
                    <label for="profile-name">Display Name</label>
                    <input type="text" id="profile-name" class="text-input" placeholder="Your name">
                </div>
                <div class="form-group">
                    <label for="profile-role">Role / Title</label>
                    <input type="text" id="profile-role" class="text-input" placeholder="Student, Researcher, etc.">
                </div>
                <div class="form-group">
                    <label for="profile-bio">Bio / Signature</label>
                    <textarea id="profile-bio" class="text-input" rows="3" placeholder="A short bio or signature..."></textarea>
                </div>
                <div class="form-group">
                    <label for="profile-email">Email</label>
                    <input type="email" id="profile-email" class="text-input" placeholder="you@example.com">
                </div>
                <div class="form-group">
                    <label for="profile-institution">Institution / Organization</label>
                    <input type="text" id="profile-institution" class="text-input" placeholder="University, School, etc.">
                </div>
                <button id="save-profile-btn" class="primary-btn">💾 Save Profile</button>
            </section>

            <!-- Banner Customization -->
            <section class="profile-card glass-panel">
                <h2 class="card-title">Banner & Style</h2>
                <div class="form-group">
                    <label>Banner Color</label>
                    <div class="color-grid" id="banner-colors"></div>
                </div>
                <div class="form-group">
                    <label>Avatar Emoji</label>
                    <div class="emoji-grid" id="emoji-options"></div>
                </div>
                <div class="form-group">
                    <label>Accent Color</label>
                    <div class="color-grid" id="accent-colors"></div>
                </div>
                <button id="save-style-btn" class="primary-btn">🎨 Save Style</button>
            </section>

            <!-- Stats / Achievements -->
            <section class="profile-card glass-panel">
                <h2 class="card-title">Achievements</h2>
                <div class="achievements-grid" id="achievements">
                    <div class="achievement">
                        <span class="ach-icon">🏆</span>
                        <span class="ach-name">First Note</span>
                        <span class="ach-status" id="ach-note">Locked</span>
                    </div>
                    <div class="achievement">
                        <span class="ach-icon">📅</span>
                        <span class="ach-name">First Event</span>
                        <span class="ach-status" id="ach-event">Locked</span>
                    </div>
                    <div class="achievement">
                        <span class="ach-icon">✅</span>
                        <span class="ach-name">First Task</span>
                        <span class="ach-status" id="ach-task">Locked</span>
                    </div>
                    <div class="achievement">
                        <span class="ach-icon">⏱️</span>
                        <span class="ach-name">Focus Master</span>
                        <span class="ach-status" id="ach-focus">Locked</span>
                    </div>
                </div>
            </section>

        </main>
    </div>

    <!-- Theme Menu -->
    <div id="theme-menu" class="theme-menu hidden">
        <button data-theme="normal">☀️ Normal</button>
        <button data-theme="dark">🌙 Dark</button>
        <button data-theme="light">✨ Light</button>
        <button data-theme="glass">💎 Glass</button>
    </div>

    <!-- Toast -->
    <div id="toast-container" class="toast-container"></div>

    <script src="main.js"></script>
</body>
</html>
